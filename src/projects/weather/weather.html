<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="../../base.css" />
    <link rel="stylesheet" href="./style-weather.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="project-name">Weather Forecast</h1>
      </header>
      <main class="weather-app-container">
        <form class="search-form js-search-form">
          <input
            class="form-input-search"
            type="text"
            name="cityName"
            placeholder="Enter city name in English (for example, Prague)"
            required
          />
          <button class="button-general form-search-btn" type="submit">
            Search
          </button>
          <label class="number-of-days"
            >Enter the number of days
            <select
              class="form-days-container js-forecast-days-container"
              name="forecastDays"
            ></select
          ></label>
        </form>
        <section
          class="section-container current-city-weather js-weather-forecast-section"
        >
          <div class="weather-today-container js-weather-today-container">
            <p class="empty-msg">You haven't searched for any city yet.</p>
          </div>
          <ul class="city-forecast-container js-city-forecast-container"></ul>
        </section>
        <section class="section-container js-favorites-cities">
          <h2 class="favorites-cities-title">Favorite Cities</h2>
          <p class="number-of-days js-favorites-days-wrapper is-collapsed">
            Enter the number of days
            <select
              class="favorites-cities-days-container js-favorites-cities-days-container"
            ></select>
          </p>
          <div class="favorites-city-cards js-favorites-city-cards"></div>
        </section>
      </main>
    </div>
    <div class="backdrop is-hidden js-modal-backdrop">
      <div class="modal">
        <button type="button" class="modal-close-btn js-modal-close-btn">
          ✕
        </button>
        <div class="js-modal-content"></div>
      </div>
    </div>
    <script type="module" src="./app-weather.js"></script>
  </body>
</html>
