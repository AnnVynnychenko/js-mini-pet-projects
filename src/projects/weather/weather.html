<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="../../base.css" />
    <link rel="stylesheet" href="./style-weather.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="project-name">Weather Forecast</h1>
      </header>
      <main>
        <form class="js-search-form">
          <input
            type="text"
            name="cityName"
            placeholder="Enter city name in English (for example, Prague)"
            required
          />
          <button type="submit">Search</button>
          <select
            class="js-forecast-days-container"
            name="forecastDays"
          ></select>
        </form>
        <section class="current-city-weather js-weather-forecast-section">
          <div class="js-weather-today-container"></div>
          <ul class="js-city-forecast-container"></ul>
        </section>
        <section class="favorites-cities"></section>
      </main>
    </div>
    <div class="backdrop is-hidden js-modal-backdrop">
      <div class="modal">
        <button type="button" class="modal-close-btn js-modal-close-btn">
          ✕
        </button>
        <div class="js-modal-content"></div>
      </div>
    </div>
    <script type="module" src="./app-weather.js"></script>
  </body>
</html>
